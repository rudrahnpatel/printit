<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Arrange images onto as few printable sheets as possible." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
        // Apply the saved theme before first paint so there is no light flash.
        (function () {
            try {
                var saved = localStorage.getItem('ezzprint-theme') || 'system';
                var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            } catch (e) { /* private mode: fall back to light */ }
        })();
    </script>
    <title>EzzPrint</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
</body>

</html>
