<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="3" dy="3" result="offsetblur" />
      <feFlood flood-color="rgba(0,0,0,0.2)" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#grad1)" />
  
  <!-- Stacked Screenshots forming an "E" -->
  <!-- Left padding approx 110 -->
  
  <!-- Top Window -->
  <g filter="url(#shadow)">
    <rect x="110" y="110" width="280" height="75" rx="8" fill="white" opacity="0.95" />
  </g>
  
  <!-- Middle Window - Shorter -->
  <g filter="url(#shadow)">
    <rect x="110" y="218.5" width="200" height="75" rx="8" fill="white" opacity="0.9" />
  </g>
  
  <!-- Bottom Window - Longest -->
  <g filter="url(#shadow)">
    <rect x="110" y="327" width="310" height="75" rx="8" fill="white" opacity="0.95" />
  </g>
</svg>
